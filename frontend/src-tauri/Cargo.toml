[package]
name = "use-memo"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Local-first AI meeting and note studio"
default-run = "use-memo"

[lib]
name = "use_memo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["asr", "system-audio"]
# Bundled whisper.cpp inference for on-device transcription.
asr = ["dep:whisper-rs"]
# Capture what the machine plays, in addition to the microphone.
system-audio = ["dep:screencapturekit", "dep:wasapi", "dep:libpulse-sys"]

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
memo-litert-bridge = { path = "../../crates/memo-litert-bridge" }
memo-audio-capture = { path = "../../crates/memo-audio-capture" }
memo-diarize = { path = "../../crates/memo-diarize" }
memo-mobile-audio = { path = "../../crates/memo-mobile-audio" }
libsqlite3-sys = { version = "0.30", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate"] }
tauri = { version = "2", features = ["macos-private-api", "protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-deep-link = "2"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
uuid = { version = "1", features = ["serde", "v7"] }
webp = "0.3"

# Whisper on-device ASR with Metal GPU acceleration on Apple platforms.
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
whisper-rs = { version = "0.16", optional = true, features = ["metal"] }

[target.'cfg(not(any(target_os = "macos", target_os = "ios")))'.dependencies]
whisper-rs = { version = "0.16", optional = true }

# System-audio loopback. Each backend is only compiled on its own platform.
[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = { version = "10.0.3", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
wasapi = { version = "0.27", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
libpulse-sys = { version = "1.23", optional = true }

[dev-dependencies]
memo-audio-capture = { path = "../../crates/memo-audio-capture" }
tempfile = "3"

