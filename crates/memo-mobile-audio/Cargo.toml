[package]
name = "memo-mobile-audio"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Microphone permission and audio-session plumbing for UseMemo mobile builds"
links = "memo-mobile-audio"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2" }
thiserror = "2"

[dev-dependencies]
serde_json = "1"
