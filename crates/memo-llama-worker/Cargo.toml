[package]
name = "memo-llama-worker"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Local GGUF inference worker (llama.cpp + Metal/SIMD + GBNF JSON) for grounded meeting synthesis"

[[bin]]
name = "memo-litert-worker"
path = "src/main.rs"

[dependencies]
memo-litert-bridge = { path = "../memo-litert-bridge" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
llama-cpp-2 = { version = "0.1.161", default-features = false, features = ["sampler", "metal"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
llama-cpp-2 = { version = "0.1.161", default-features = false, features = ["sampler"] }
