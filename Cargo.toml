[workspace]
resolver = "2"
members = ["frontend/src-tauri", "crates/memo-audio-capture"]
exclude = ["upstream"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.77.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
